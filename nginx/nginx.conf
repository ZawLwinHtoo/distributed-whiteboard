# Nginx API Gateway & Load Balancer Configuration for CollabDraw

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream backend cluster with IP Hash sticky session routing
    upstream collabdraw_backend {
        ip_hash;
        server backend-1:8000 max_fails=3 fail_timeout=5s;
        server backend-2:8000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # Client max body size for uploads/exports
        client_max_body_size 10M;

        location / {
            proxy_pass http://collabdraw_backend;

            # HTTP 1.1 & WebSocket Upgrade Headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Pass client provenance headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout settings for persistent WebSocket sessions
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://collabdraw_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
